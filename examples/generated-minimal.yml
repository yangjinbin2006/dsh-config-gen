# dsh patch layer, generated by dsh-config-gen 1.0.0
#
# Location: ~/.dsh/profiles/<profile>/cordis.patch.yml
# Applied after every bundle layer. A top-level YAML array of loader
# patch entries: id-targeted config overrides, disables, insert lists.
#
# The API key is NOT stored here. Put it in the environment variable
# named by apiKeyEnv, then fully restart dsh so it inherits the value.


- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: local-bridge
    model: chat-model
    reasoningEffort: high

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local-bridge:
        displayName: Local Bridge
        apiKeyEnv: BRIDGE_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: true
          supportsDeveloperRole: false
        models:
          - id: chat-model
            contextWindow: 1000000
            maxTokens: 128000
            supportsVision: true
